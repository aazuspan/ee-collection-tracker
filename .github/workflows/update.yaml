name: Update data

on:
  workflow_dispatch:
  schedule:
  - cron: '30 23 * * *'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    environment: ee
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.13

    - name: Update Landsat assets
      env:
        EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
      run: |
        uv run update-landsat

    - name: Update Sentinel-2 assets
      env:
        EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
      run: |
        uv run update-sentinel2

    - name: Update HLS assets
      env:
        EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}
      run: |
        uv run update-hls

    - name: Update README
      run: |
        uv run update-readme

    - name: Commit changes
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Data updated ${timestamp}" || exit 0
        git push
