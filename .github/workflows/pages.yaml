name: Deploy site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**]
  # Commits pushed by the update workflow don't trigger push events, so redeploy
  # whenever it finishes.
  workflow_run:
    workflows: [Update data]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: main

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: site

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5
